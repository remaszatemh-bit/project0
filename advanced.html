<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RE Advanced Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- شريط الانتقال العلوي -->
    <header class="adv-header">
      <div class="adv-logo">
        <a href="index.html">
          <span class="blue">R</span><span class="red">E</span>
        </a>
      </div>
      <nav class="top-nav">
        <a href="index.html">RE Search</a>
      </nav>
    </header>

    <div class="adv-container">
      <h2 class="adv-title">Advanced Search</h2>
      <hr />

      <p class="adv-subtitle">Find pages with...</p>

      <!-- نموذج البحث المتقدم -->
      <form
        action="https://www.google.com/search"
        method="GET"
        class="adv-form"
      >
        <div class="form-row">
          <label for="all">all these words:</label>
          <input type="text" id="all" name="as_q" class="adv-input" />
        </div>

        <div class="form-row">
          <label for="exact">this exact word or phrase:</label>
          <input type="text" id="exact" name="as_epq" class="adv-input" />
        </div>

        <div class="form-row">
          <label for="any">any of these words:</label>
          <input type="text" id="any" name="as_oq" class="adv-input" />
        </div>

        <div class="form-row">
          <label for="none">none of these words:</label>
          <input type="text" id="none" name="as_eq" class="adv-input" />
        </div>

        <div class="form-row btn-row">
          <input type="submit" value="Advanced Search" class="btn-adv" />
        </div>
      </form>
    </div>
  </body>
</html>
